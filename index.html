        .mic-btn {

            height: 90px;
            border-radius: 50%;
            background: #ff4757;
            border: none;
            color: white;
            font-size: 36px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            margin: 15px auto;
            display: block;
        }
        .mic-btn:hover { transform: scale(1.05); }

            0% { box-shadow: 0 0 0 0 rgba(46, 213, 115, 0.7); }

        .status { font-size: 16px; margin-bottom: 12px; min-height: 22px; color: #ffd32a; text-align: center; }

            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-style: italic;
            min-height: 20px;
            text-align: center;
            font-size: 14px;
        }

            margin-bottom: 15px;
        }

            width: 100%;
            padding: 12px 42px 12px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 16px;
        }
        .search-box::placeholder { color: rgba(255,255,255,0.6); }
        .clear-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            padding: 0;
            line-height: 1;
        }
        .clear-btn:hover { background: rgba(255, 71, 87, 0.7); }
        .clear-btn.visible { display: flex; }
        .result-item {
            background: rgba(255,255,255,0.15);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #2ed573;

            gap: 12px;
            align-items: center;

            font-size: 20px;

            text-align: center;

            line-height: 1;

            display: block;
            font-size: 9px;
            font-weight: normal;
            margin-bottom: 2px;
            opacity: 0.8;

        const trimmed = line.trim();
        if (!trimmed) return;

        const progMatch = trimmed.match(/^№\s*(\d+)\.\s*(.*)/);
        if (progMatch) {
            saveTrack();
            currentProgNum = progMatch[1];
            currentProgName = progMatch[2];
            currentTrackNum = ""; currentTitle = ""; currentAuthor = "";
            programs.push({ num: currentProgNum, name: currentProgName, tracks: [] });
            return;
        }

        const trackMatch = trimmed.match(/^(\d+)\.\s+(.*)/);
        if (trackMatch) {
            saveTrack();
            currentTrackNum = trackMatch[1];
            currentTitle = trackMatch[2];
            currentAuthor = "";
            return;
        }

        if (currentTrackNum) {
            currentAuthor += (currentAuthor ? " " : "") + trimmed;
        }
    });
    saveTrack();

    document.getElementById('stats').textContent = `Загружено программ: ${programs.length} | Всего произведений: ${index.length}`;

    // === ПОИСК ТОЛЬКО ПО НАЗВАНИЮ ===
    function normalize(str) {
        return str
            .toLowerCase()
            .replace(/ё/g, 'е')
            .replace(/[^a-zа-я0-9\s]/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function search(query) {
        const q = normalize(query);
        if (!q || q.length < 2) return [];
        return index.filter(item => normalize(item.title).includes(q));
    }

    // === РЕЗУЛЬТАТЫ: строка 1 — название, строка 2 — автор ===
    function renderResults(results, query) {
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '';

        if (!query || query.length < 2) return;

        if (results.length === 0) {
            resultsDiv.innerHTML = `<div class="result-item" style="border-left-color: #ff4757;"><h3>Ничего не найдено</h3><p class="author-name">Попробуйте произнести или написать название иначе.</p></div>`;
            return;
        }

        results.forEach(res => {
            const item = document.createElement('div');
            item.className = 'result-item';
            item.innerHTML = `
                <div class="prog-badge" data-prog="${res.progNum}">
                    <small>ПРОГРАММА</small>
                    № ${res.progNum}
                </div>
                <div class="result-content">
                    <h3>${res.num}. ${res.title}</h3>
                    ${res.author ? `<p class="author-name">${res.author}</p>` : ''}
                </div>
            `;
            item.querySelector('.prog-badge').addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelector('.tab[data-tab="programs"]').classList.add('active');
                document.getElementById('tab-search').classList.add('hidden');
                document.getElementById('tab-programs').classList.remove('hidden');
                openProgram(res.progNum);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
            resultsDiv.appendChild(item);
        });
    }

    // === СПИСОК ПРОГРАММ ===
    function renderPrograms() {
        const grid = document.getElementById('programs-grid');
        grid.innerHTML = '';
        programs.forEach(prog => {
            const card = document.createElement('div');
            card.className = 'program-card';
            card.innerHTML = `
                <div class="card-num">${prog.num}</div>
                <div class="card-title">${prog.name}</div>
            `;
            card.addEventListener('click', () => openProgram(prog.num));
            grid.appendChild(card);
        });
    }

    // === ОТКРЫТИЕ ПРОГРАММЫ: название + автор ===
    function openProgram(progNum) {
        const prog = programs.find(p => p.num === progNum);
        if (!prog) return;

        document.getElementById('programs-list').classList.add('hidden');
        document.getElementById('tracks-list').classList.remove('hidden');

        document.getElementById('tracks-header').innerHTML =
            `<h2>Программа №${prog.num}</h2><p>${prog.name}</p>`;

        const container = document.getElementById('tracks-container');
        container.innerHTML = '';
        prog.tracks.forEach(track => {
            const item = document.createElement('div');
            item.className = 'track-item';
            item.innerHTML = `
                <div class="track-num">${track.num}</div>
                <div class="track-title">
                    <div>${track.title}</div>
                    ${track.author ? `<div class="track-author">${track.author}</div>` : ''}
                </div>
            `;
            container.appendChild(item);
        });
    }

    // === НАВИГАЦИЯ ===
    document.getElementById('backBtn').addEventListener('click', () => {
        document.getElementById('tracks-list').classList.add('hidden');
        document.getElementById('programs-list').classList.remove('hidden');
    });

    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            const tabName = tab.dataset.tab;
            document.getElementById('tab-search').classList.toggle('hidden', tabName !== 'search');
            document.getElementById('tab-programs').classList.toggle('hidden', tabName !== 'programs');
            if (tabName === 'programs') {
                document.getElementById('tracks-list').classList.add('hidden');
                document.getElementById('programs-list').classList.remove('hidden');
            }
        });
    });

    // === КРЕСТИК ОЧИСТКИ ПОИСКА ===
    const clearBtn = document.getElementById('clearBtn');

    function updateClearBtn(val) {
        clearBtn.classList.toggle('visible', val.length > 0);
    }

    clearBtn.addEventListener('click', () => {
        textInput.value = '';
        recognizedText.textContent = 'Здесь появится распознанный текст...';
        document.getElementById('results').innerHTML = '';
        updateClearBtn('');
        textInput.focus();
    });

    // === ГОЛОСОВОЙ ВВОД ===
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const micBtn = document.getElementById('micBtn');
    const status = document.getElementById('status');
    const recognizedText = document.getElementById('recognizedText');
    const textInput = document.getElementById('textInput');
    const warning = document.getElementById('warning');

    let recognition;
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isSecure = window.isSecureContext;

    if (SpeechRecognition && isSecure) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ru-RU';
        recognition.interimResults = false;
        recognition.continuous = false;

        recognition.onstart = () => {
            status.textContent = 'Слушаю вас...';
            micBtn.classList.add('listening');
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            recognizedText.textContent = `"${transcript}"`;
            textInput.value = transcript;
            updateClearBtn(transcript);
            renderResults(search(transcript), transcript);
            status.textContent = 'Готов к поиску';
            micBtn.classList.remove('listening');
        };

        recognition.onerror = (event) => {
            status.textContent = 'Ошибка: ' + event.error;
            micBtn.classList.remove('listening');
        };

        recognition.onend = () => {
            micBtn.classList.remove('listening');
            if (status.textContent === 'Слушаю вас...') {
                status.textContent = 'Готов к поиску';
            }
        };

        micBtn.addEventListener('click', () => {
            if (micBtn.classList.contains('listening')) {
                recognition.stop();
            } else {
                recognizedText.textContent = 'Здесь появится распознанный текст...';
                try { recognition.start(); } catch(e) {}
            }
        });
    } else {
        micBtn.style.opacity = '0.4';
        micBtn.style.cursor = 'not-allowed';
        let reason = '';
        if (!isSecure) {
            reason = '⚠️ Голосовой ввод работает только по HTTPS.<br><br>';
        } else if (isIOS) {
            reason = '⚠️ Safari не поддерживает голосовой ввод в браузере.<br><br>';
        }
        warning.innerHTML = `
            ${reason}
            <div style="background: rgba(46, 213, 115, 0.15); border: 1px solid #2ed573;
                        padding: 12px; border-radius: 10px; margin-top: 10px; text-align: left;">
                <strong style="color: #7bed9f;">📱 Диктовка на iPhone:</strong><br>
                Нажмите на текстовое поле 👇 → на клавиатуре нажмите <strong>🎤</strong> → говорите.
            </div>
        `;
    }

    textInput.addEventListener('input', (e) => {
        const val = e.target.value;
        recognizedText.textContent = val ? `"${val}"` : 'Здесь появится распознанный текст...';
        updateClearBtn(val);
        renderResults(search(val), val);
    });

    renderPrograms();
</script>
</body>
</html>
