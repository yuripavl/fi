    // === 2. УМНЫЙ ПАРСЕР ===
    const index = [];
    const lines = rawData.split('\n');
    let currentProg = "Программа 1";
    let currentProgNum = "1";
    let currentTrackNum = "";
    let currentTrackText = "";
    let waitingForFirstTrack = false;

    function saveTrack() {
        if (currentTrackNum) {
            index.push({
                prog: currentProg,
                progNum: currentProgNum,
                num: currentTrackNum,
                text: currentTrackText.trim()
            });
        }
    }

    lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;

        // Заголовок программы: "№ 1. НАЗВАНИЕ" или "№ 15. "Сделано в СССР"(...)"
        const progMatch = trimmed.match(/^№\s*(\d+)\.\s*(.*)/);
        if (progMatch) {
            saveTrack();
            currentProgNum = progMatch[1];
            currentProg = `Программа №${progMatch[1]}: ${progMatch[2]}`;
            currentTrackNum = "";
            currentTrackText = "";
            waitingForFirstTrack = true;
            return;
        }

        // Трек: "1. Автор" или "12. Название"
        const trackMatch = trimmed.match(/^(\d+)\.\s+(.*)/);
        if (trackMatch) {
            saveTrack();
            currentTrackNum = trackMatch[1];
            currentTrackText = trimmed;
            waitingForFirstTrack = false;
            return;
        }

        // Продолжение текста
        if (waitingForFirstTrack) {
            currentProg += " (" + trimmed + ")";
        } else if (currentTrackNum) {
            currentTrackText += " " + trimmed;
        }
    });
    saveTrack();

    document.getElementById('stats').textContent = `Загружено программ: 15 | Всего треков: ${index.length}`;

    // === 3. НОРМАЛИЗАЦИЯ И ПОИСК ===
    function normalize(str) {
        return str
            .toLowerCase()
            .replace(/ё/g, 'е')
            .replace(/[^a-zа-я0-9\s]/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function search(query) {
        const q = normalize(query);
        if (!q || q.length < 2) return [];
        
        return index.filter(item => {
            const text = normalize(item.text);
            return text.includes(q);
        });
    }

    // Слова-исключения, которые не должны попадать в название
    const STOP_WORDS = ['исполняет', 'оркестр', 'солистка', 'солист', 'дуэт', 'трио',
        'ансамбль', 'музыка', 'слова', 'муз', 'сл', 'рус', 'текст', 'пер',
        'меццо', 'сопрано', 'баритон', 'тенор', 'бас', 'эстрадный', 'эстрадная',
        'певец', 'певица', 'голосом', 'высоким', 'низким', 'скрипка', 'соло',
        'рояль', 'оперы', 'оперетты', 'мюзикла', 'сюиты', 'цикла', 'к/ф',
        'из', 'и', 'в', 'на', 'к', 'о', 'а'];

    function extractTitle(text) {
        // 1. Сначала ищем текст в кавычках (любого типа) — это часто и есть название
        const quotedMatch = text.match(/["«]([^"»]+)["»]/);
        
        // 2. Ищем все последовательности ЗАГЛАВНЫХ букв (кириллица + латиница)
        const upperMatches = text.match(/[А-ЯA-ZЁ][А-ЯA-ZЁ0-9']*(?:\s+[А-ЯA-ZЁ0-9',\-]+)*/g) || [];
        
        // Фильтруем стоп-слова и короткие совпадения
        const filtered = upperMatches
            .map(m => m.trim())
            .filter(m => {
                const words = m.toLowerCase().split(/\s+/);
                // Отбрасываем, если все слова — стоп-слова
                return !words.every(w => STOP_WORDS.includes(w.replace(/[^а-яa-z]/g, '')));
            })
            .filter(m => m.length > 3);

        // Если нашли кавычки и внутри них заглавные буквы — берём их
        if (quotedMatch) {
            const inside = quotedMatch[1].trim();
            // Проверяем, есть ли там заглавные буквы
            if (/[А-ЯA-ZЁ]{2,}/.test(inside)) {
                return inside;
            }
        }

        // Иначе берём самое длинное подходящее совпадение
        if (filtered.length > 0) {
            filtered.sort((a, b) => b.length - a.length);
            return filtered[0];
        }

        // Фолбэк: первые 60 символов
        return text.substring(0, 60) + (text.length > 60 ? '...' : '');
    }

    function renderResults(results, query) {
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '';
        
        if (!query || query.length < 2) return;

        if (results.length === 0) {
            resultsDiv.innerHTML = `<div class="result-item" style="border-left-color: #ff4757;"><h3>Ничего не найдено</h3><p>Попробуйте произнести или написать название иначе.</p></div>`;
            return;
        }

        results.forEach(res => {
            const prettyTitle = extractTitle(res.text);
            const item = document.createElement('div');
            item.className = 'result-item';
            item.innerHTML = `
                <h3>🎼 ${prettyTitle}</h3>
                <p class="prog">📁 ${res.prog}</p>
                <p>🎵 <strong>Трек № ${res.num}</strong></p>
            `;
            resultsDiv.appendChild(item);
        });
    }

    // === 4. ГОЛОСОВОЙ ВВОД ===
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const micBtn = document.getElementById('micBtn');
    const status = document.getElementById('status');
    const recognizedText = document.getElementById('recognizedText');
    const textInput = document.getElementById('textInput');
    const warning = document.getElementById('warning');

    let recognition;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ru-RU';
        recognition.interimResults = false;
        recognition.continuous = false;

        recognition.onstart = () => {
            status.textContent = '🎧 Слушаю вас...';
            micBtn.classList.add('listening');
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            recognizedText.textContent = `"${transcript}"`;
            textInput.value = transcript;
            const results = search(transcript);
            renderResults(results, transcript);
            status.textContent = 'Готов к поиску';
            micBtn.classList.remove('listening');
        };

        recognition.onerror = (event) => {
            status.textContent = 'Ошибка: ' + event.error;
            micBtn.classList.remove('listening');
        };

        recognition.onend = () => {
            micBtn.classList.remove('listening');
            if (status.textContent === '🎧 Слушаю вас...') {
                status.textContent = 'Готов к поиску';
            }
        };

        micBtn.addEventListener('click', () => {
            if (micBtn.classList.contains('listening')) {
                recognition.stop();
            } else {
                recognizedText.textContent = 'Здесь появится распознанный текст...';
                try { recognition.start(); } catch(e) {}
            }
        });
    } else {
        micBtn.style.display = 'none';
        warning.textContent = '⚠️ Ваш браузер не поддерживает голосовой ввод. Используйте текстовое поле или откройте сайт в Google Chrome.';
    }

    // Поиск по ручному вводу
    textInput.addEventListener('input', (e) => {
        const val = e.target.value;
        recognizedText.textContent = val ? `"${val}"` : 'Здесь появится распознанный текст...';
        const results = search(val);
        renderResults(results, val);
    });
</script>
